<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AldayFinance</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--sf:#141a2e;--sf2:#1c2440;--bd:#262f52;--tx:#e8ecf8;--mu:#8b95b8;--ac:#22d3ee;--ok:#34d399;--no:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
nav{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav h1{display:none}nav a{flex:1;text-align:center;padding:8px 0;color:var(--mu);text-decoration:none;font-size:10px}nav a b{display:block;font-size:18px}nav a.on{color:var(--ac)}
main{padding:14px 14px 100px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}.g .c{margin:0}
small{display:block;color:var(--mu);font-size:12px}.c h2{margin:4px 0 0;font-size:20px}
.in{color:var(--ok)}.out{color:var(--no)}.tf{color:var(--ac)}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}.row i{height:30px;border-radius:4px}.row span{text-align:right;font-weight:600}
button,input,select{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%;transition:.15s}
button{width:auto;cursor:pointer}button.p{background:var(--ac);color:#06202a;border:0;font-weight:700}button.d{background:var(--no);color:#2a0a0a;border:0}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.bar>*{width:auto}.bar button.on{background:var(--ac);color:#06202a}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;width:52px;height:52px;border-radius:50%;font-size:26px;padding:0;box-shadow:0 4px 16px #0008}
#m{display:none;position:fixed;inset:0;z-index:9;background:#000a;align-items:center;justify-content:center;padding:12px}#m.on{display:flex}
.md{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
label{display:block;margin:8px 0 2px;color:var(--mu);font-size:12px}
form[data-t=in] .xf,form[data-t=out] .xf,form[data-t=tf] .xc{display:none}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:var(--sf2);border:1px solid var(--ac);padding:8px 16px;border-radius:20px;z-index:10;opacity:0;transition:.3s;pointer-events:none}#t.on{opacity:1}
svg{width:100%;height:auto}
@media(min-width:800px){nav{top:0;right:auto;width:200px;flex-direction:column;border:0;border-right:1px solid var(--bd);padding:16px 8px}nav h1{display:block;font-size:18px;margin:0 8px 16px;color:var(--ac)}nav a{text-align:left;font-size:14px;padding:10px 12px;border-radius:10px}nav a b{display:inline;font-size:16px;margin-right:8px}nav a.on{background:var(--sf2)}main{margin-left:200px;padding:24px 32px}.fab{bottom:24px}#t{bottom:24px}}
</style></head><body><div id=app></div><div id=m onclick="if(event.target==this)closeM()"></div><div id=t></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=n=>(n<0?'-':'')+'Rp'+Math.abs(n).toLocaleString('id-ID'),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),iso=d=>d.toLocaleDateString('sv-SE'),today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Jakarta'});
const PAL=['#22d3ee','#34d399','#fbbf24','#a78bfa','#f472b6','#fb923c','#60a5fa','#f87171','#2dd4bf','#c084fc','#a3e635','#e879f9'];
const DEF=[...'Gaji,Bonus,Freelance,Bisnis,Hadiah,Pengembalian uang,Pendapatan lainnya'.split(',').map(n=>[n,'in']),...'Makanan dan minuman,Transportasi,Pendidikan,Kesehatan,Belanja,Hiburan,Tagihan,Tempat tinggal,Kebutuhan pribadi,Langganan,Donasi,Pengeluaran lainnya'.split(',').map(n=>[n,'out'])].map(([n,t],i)=>({id:'c'+i,n,t,c:PAL[i%12]})).concat({id:'fee',n:'Biaya administrasi',t:'out',c:'#94a3b8',sys:1});
let db,S={accounts:[],cats:[],txs:[],set:{user:'Pengguna',app:'AldayFinance'},ready:0},P={k:'month',d:today(),f:today(),t:today()},R={...P},F={q:'',cat:'',acc:'',type:'',from:'',to:'',sort:'d'},tt,_ok;
const get=k=>new Promise(r=>{const q=db.transaction('d').objectStore('d').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}),
save=k=>new Promise(r=>{if(!db)return r();const t=db.transaction('d','readwrite');t.objectStore('d').put(S[k],k);t.oncomplete=r;t.onerror=()=>{toast('Gagal menyimpan data',1);r()}});
const toast=(m,e)=>{const t=$('#t');t.textContent=m;t.style.borderColor=e?'var(--no)':'var(--ac)';t.className='on';clearTimeout(tt);tt=setTimeout(()=>t.className='',2600)},
modal=h=>{$('#m').innerHTML='<div class=md>'+h+'</div>';$('#m').className='on'},closeM=()=>{$('#m').className='';$('#m').innerHTML=''},
ask=(m,fn)=>{_ok=fn;modal(`<p>${m}</p><div class=bar><button onclick=closeM()>Batal</button><button class=d onclick="closeM();_ok()">Ya, lanjutkan</button></div>`)};
const act=()=>S.accounts.filter(a=>!a.off),cat=id=>S.cats.find(c=>c.id==id)||{n:'(dihapus)',c:'#64748b'},acc=id=>S.accounts.find(a=>a.id==id)||{n:'-'},
delta=(t,id)=>{let d=0;if(t.acc==id)d+=t.type=='in'?t.amt:-(t.amt+(t.fee||0));if(t.type=='tf'&&t.to==id)d+=t.amt;return d},
balA=(a,e='9999')=>S.txs.reduce((s,t)=>t.date<=e?s+delta(t,a.id):s,a.open),total=e=>act().reduce((s,a)=>s+balA(a,e),0),
sortTx=(a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts,empty='<small style="padding:10px 0">Belum ada data.</small>';
const agg=r=>{const L=S.txs.filter(t=>t.date>=r[0]&&t.date<=r[1]),o={inc:0,exp:0,tf:0,fee:0,n:L.length,L,ci:{},ce:{}};for(const t of L){if(t.type=='in'){o.inc+=t.amt;o.ci[t.cat]=(o.ci[t.cat]||0)+t.amt}else if(t.type=='out'){o.exp+=t.amt;o.ce[t.cat]=(o.ce[t.cat]||0)+t.amt}else{o.tf+=t.amt;o.fee+=t.fee;o.exp+=t.fee;if(t.fee)o.ce.fee=(o.ce.fee||0)+t.fee}}return o};
const range=o=>{const n=new Date(o.d+'T00:00'),y=n.getFullYear(),m=n.getMonth();if(o.k=='day')return[o.d,o.d];if(o.k=='week'){const s=new Date(y,m,n.getDate()-(n.getDay()+6)%7),e=new Date(s);e.setDate(s.getDate()+6);return[iso(s),iso(e)]}if(o.k=='year')return[y+'-01-01',y+'-12-31'];if(o.k=='custom')return o.f<=o.t?[o.f,o.t]:[o.t,o.f];return[iso(new Date(y,m,1)),iso(new Date(y,m+1,0))]},
prev=([f,e])=>{const a=new Date(f+'T00:00'),n=Math.round((new Date(e+'T00:00')-a)/864e5)+1,s=new Date(a),t=new Date(a);s.setDate(s.getDate()-n);t.setDate(t.getDate()-1);return[iso(s),iso(t)]},
months=()=>{const n=new Date(today()+'T00:00');return[...Array(6)].map((_,i)=>{const d=new Date(n.getFullYear(),n.getMonth()-5+i,1);return{k:iso(d).slice(0,7),l:d.toLocaleDateString('id-ID',{month:'short'}),e:iso(new Date(d.getFullYear(),d.getMonth()+1,0))}})},
catList=m=>Object.entries(m).map(([id,v])=>({...cat(id),v})).sort((a,b)=>b.v-a.v);
const bars=d=>{const m=Math.max(1,...d.flatMap(x=>[x.a,x.b])),w=320/d.length;return`<svg viewBox="0 0 320 150">${d.map((x,i)=>{const h1=x.a/m*105,h2=x.b/m*105,o=i*w+w*.15,b=w*.32;return`<rect x="${o}" y="${120-h1}" width="${b}" height="${h1}" fill="var(--ok)" rx="2"><title>${x.l} pemasukan ${fmt(x.a)}</title></rect><rect x="${o+b+2}" y="${120-h2}" width="${b}" height="${h2}" fill="var(--no)" rx="2"><title>${x.l} pengeluaran ${fmt(x.b)}</title></rect><text x="${i*w+w/2}" y="140" fill="var(--mu)" font-size="10" text-anchor="middle">${x.l}</text>`}).join('')}</svg>`},
line=d=>{const v=d.map(x=>x.v),mx=Math.max(...v,0),mn=Math.min(...v,0),r=mx-mn||1,X=i=>20+i*280/(d.length-1||1),Y=x=>115-(x-mn)/r*100;return`<svg viewBox="0 0 320 150"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${d.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>${d.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="4" fill="var(--ac)"><title>${x.l}: ${fmt(x.v)}</title></circle><text x="${X(i)}" y="140" fill="var(--mu)" font-size="10" text-anchor="middle">${x.l}</text>`).join('')}</svg>`},
pie=a=>{const d=catList(a.ce),T=d.reduce((s,x)=>s+x.v,0);if(!T)return empty;let o=0;return`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 42 42" style="width:140px"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--sf2)" stroke-width="6"/>${d.map(x=>{const p=x.v/T*100,s=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${x.c}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-o}"><title>${esc(x.n)}: ${fmt(x.v)}</title></circle>`;o+=p;return s}).join('')}</svg><div style="flex:1;min-width:130px">${d.slice(0,6).map(x=>`<small><span style="color:${x.c}">●</span> ${esc(x.n)} ${Math.round(x.v/T*100)}%</small>`).join('')}</div></div>`};
const card=(l,v,c,x)=>`<div class=c><small>${l}</small><h2 class="${c||''}">${v}</h2>${x||''}</div>`,
sel=(o,v,h)=>`<select onchange="${h}">${o.map(([k,l])=>`<option value="${k}"${k==v?' selected':''}>${esc(l)}</option>`).join('')}</select>`,
pbar=(o,fn,L,an)=>`<div class=bar>${['day','week','month','year','custom'].map((k,i)=>`<button class="${o.k==k?'on':''}" onclick="${fn}('k','${k}')">${L[i]}</button>`).join('')}${o.k=='custom'?`<input type=date value="${o.f}" onchange="${fn}('f',this.value)"><input type=date value="${o.t}" onchange="${fn}('t',this.value)">`:an?`<input type=date value="${o.d}" onchange="${fn}('d',this.value)">`:''}</div>`,
sP=(k,v)=>{P[k]=v;render()},sR=(k,v)=>{R[k]=v;render()},
row=t=>{const c=cat(t.cat),f=t.type=='tf';return`<div class=row onclick="txForm('${t.id}')"><i style="background:${f?'var(--ac)':c.c}"></i><div><b>${esc(t.desc)}</b><small>${t.date} • ${f?'Transfer':esc(c.n)} • ${esc(acc(t.acc).n)}${f?' → '+esc(acc(t.to).n):''}</small></div><span class="${t.type}">${t.type=='in'?'+':t.type=='out'?'-':''}${fmt(t.amt)}${t.fee?`<small>biaya ${fmt(t.fee)}</small>`:''}</span></div>`},
crow=(m,T)=>catList(m).map(x=>`<div class=row style=cursor:default><i style="background:${x.c}"></i><div><b>${esc(x.n)}</b><small>${T?Math.round(x.v/T*100):0}%</small></div><span>${fmt(x.v)}</span></div>`).join('')||empty;
function pDash(){const a=agg(range(P)),M=months().map(m=>{const g=agg([m.k+'-01',m.k+'-31']);return{l:m.l,a:g.inc,b:g.exp,v:total(m.e)}});
return`${pbar(P,'sP',['Hari ini','Minggu ini','Bulan ini','Tahun ini','Rentang'])}<div class=g>${card('Total saldo',fmt(total()))}${card('Pemasukan',fmt(a.inc),'in')}${card('Pengeluaran',fmt(a.exp),'out')}${card('Selisih',fmt(a.inc-a.exp),a.inc>=a.exp?'in':'out')}${card('Jumlah transaksi',a.n)}</div><div class="g g2"><div class=c><small>Pemasukan vs pengeluaran, 6 bulan terakhir</small>${bars(M)}</div><div class=c><small>Perkembangan total saldo</small>${line(M)}</div><div class=c><small>Pengeluaran per kategori (periode terpilih)</small>${pie(a)}</div><div class=c><small>Saldo rekening</small>${act().map(x=>`<div class=row style=cursor:default><i style=background:var(--ac)></i><b>${esc(x.n)}</b><span>${fmt(balA(x))}</span></div>`).join('')||empty}</div></div><div class=c><small>Transaksi terbaru</small>${S.txs.slice().sort(sortTx).slice(0,8).map(row).join('')||empty}</div>`}
function listHtml(){const q=F.q.toLowerCase(),L=S.txs.filter(t=>(!q||(t.desc+t.note).toLowerCase().includes(q))&&(!F.cat||t.cat==F.cat)&&(!F.acc||t.acc==F.acc||t.to==F.acc)&&(!F.type||t.type==F.type)&&(!F.from||t.date>=F.from)&&(!F.to||t.date<=F.to));L.sort(F.sort=='d'?sortTx:F.sort=='a'?(a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts:F.sort=='h'?(a,b)=>b.amt-a.amt:(a,b)=>a.amt-b.amt);return L.map(row).join('')||empty}
const fl=(k,v)=>{F[k]=v;$('#list').innerHTML=listHtml()};
function pTx(){return`<div class=bar><input placeholder="Cari deskripsi atau catatan" value="${esc(F.q)}" oninput="fl('q',this.value)" style="flex:1;min-width:160px">${sel([['','Semua jenis'],['in','Pemasukan'],['out','Pengeluaran'],['tf','Transfer']],F.type,"fl('type',this.value)")}${sel([['','Semua kategori'],...S.cats.map(c=>[c.id,c.n])],F.cat,"fl('cat',this.value)")}${sel([['','Semua rekening'],...S.accounts.map(a=>[a.id,a.n])],F.acc,"fl('acc',this.value)")}${sel([['d','Terbaru'],['a','Terlama'],['h','Nominal terbesar'],['l','Nominal terkecil']],F.sort,"fl('sort',this.value)")}<input type=date value="${F.from}" onchange="fl('from',this.value)"><input type=date value="${F.to}" onchange="fl('to',this.value)"></div><div class=c id=list>${listHtml()}</div>`}
function pTf(){const L=S.txs.filter(t=>t.type=='tf').sort(sortTx);return`<div class=bar><button class=p onclick="txForm('','tf')">Transfer baru</button></div><div class=g>${card('Total transfer',fmt(L.reduce((s,t)=>s+t.amt,0)),'tf')}${card('Total biaya administrasi',fmt(L.reduce((s,t)=>s+t.fee,0)),'out')}</div><div class=c>${L.map(row).join('')||empty}</div>`}
function pAcc(){return`<div class=bar><button class=p onclick="accForm()">+ Rekening</button></div><div class=g>${S.accounts.map(a=>`<div class=c style="opacity:${a.off?.55:1}"><small>${esc(a.bank)}${a.off?' • nonaktif':''}</small><b>${esc(a.n)}</b><h2>${fmt(balA(a))}</h2><small>Saldo awal ${fmt(a.open)} • dibuat ${a.created}</small><div class=bar><button onclick="accDet('${a.id}')">Riwayat</button><button onclick="accForm('${a.id}')">Edit</button><button onclick="togAcc('${a.id}')">${a.off?'Aktifkan':'Nonaktifkan'}</button></div></div>`).join('')}</div>`}
function accDet(id){const a=acc(id),L=S.txs.filter(t=>t.acc==id||t.to==id).sort(sortTx);modal(`<h3>${esc(a.n)}</h3><small>${esc(a.bank)} • saldo ${fmt(balA(a))}</small>${L.map(row).join('')||empty}<div class=bar><button onclick=closeM()>Tutup</button></div>`)}
function accForm(id){const a=S.accounts.find(x=>x.id==id)||{n:'',bank:'',open:''};modal(`<h3>${id?'Edit':'Tambah'} rekening</h3><form onsubmit="return saveAcc(event,'${id||''}')"><label>Nama rekening</label><input name=n value="${esc(a.n)}"><label>Nama bank</label><input name=bank value="${esc(a.bank)}"><label>Saldo awal (Rp)</label><input type=number step=1 name=open value="${a.open}" placeholder=0>${id?'<small>Mengubah saldo awal akan mengubah saldo saat ini.</small>':''}<div class=bar><button type=button onclick=closeM()>Batal</button><button class=p>Simpan</button></div></form>`)}
async function saveAcc(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),open=+(f.open||0);if(!f.n.trim()||!f.bank.trim())return toast('Nama rekening dan bank wajib diisi',1);if(!Number.isInteger(open))return toast('Saldo awal harus bilangan bulat',1);const a=S.accounts.find(x=>x.id==id),v={n:f.n.trim(),bank:f.bank.trim(),open};a?Object.assign(a,v):S.accounts.push({id:uid(),...v,created:today(),off:false});await save('accounts');closeM();toast('Rekening disimpan');render()}
const togAcc=id=>{const a=acc(id),go=async()=>{a.off=!a.off;await save('accounts');render()};a.off?go():ask(`Nonaktifkan "${esc(a.n)}"? Riwayat tetap tersimpan, tetapi rekening tidak dihitung di total saldo.`,go)};
function pCat(){return`<div class=bar><button class=p onclick="catForm()">+ Kategori</button></div><div class="g g2">${[['in','Pemasukan'],['out','Pengeluaran']].map(([t,l])=>`<div class=c><small>${l}</small>${S.cats.filter(c=>c.t==t).map(c=>`<div class=row style=cursor:default><i style="background:${c.c}"></i><div><b>${esc(c.n)}</b><small>${S.txs.filter(x=>x.cat==c.id).length} transaksi</small></div><span><button onclick="catForm('${c.id}')">Edit</button>${c.sys?'':` <button onclick="delCat('${c.id}')">Hapus</button>`}</span></div>`).join('')}</div>`).join('')}</div>`}
function catForm(id){const c=S.cats.find(x=>x.id==id)||{n:'',t:'out',c:PAL[S.cats.length%12]};modal(`<h3>${id?'Edit':'Tambah'} kategori</h3><form onsubmit="return saveCat(event,'${id||''}')"><label>Nama</label><input name=n value="${esc(c.n)}"><label>Jenis</label><select name=t ${id?'disabled':''}><option value=in${c.t=='in'?' selected':''}>Pemasukan</option><option value=out${c.t=='out'?' selected':''}>Pengeluaran</option></select><label>Warna</label><input type=color name=c value="${c.c.startsWith('#')?c.c:'#22d3ee'}"><div class=bar><button type=button onclick=closeM()>Batal</button><button class=p>Simpan</button></div></form>`)}
async function saveCat(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),c=S.cats.find(x=>x.id==id);if(!f.n.trim())return toast('Nama kategori wajib diisi',1);c?Object.assign(c,{n:f.n.trim(),c:f.c}):S.cats.push({id:uid(),n:f.n.trim(),t:f.t,c:f.c});await save('cats');closeM();toast('Kategori disimpan');render()}
function delCat(id){const c=cat(id),n=S.txs.filter(t=>t.cat==id).length,o=S.cats.filter(x=>x.t==c.t&&x.id!=id);if(!n)return ask(`Hapus kategori "${esc(c.n)}"?`,()=>rmCat(id));if(!o.length)return toast('Tidak ada kategori lain untuk menampung transaksi',1);modal(`<h3>Hapus "${esc(c.n)}"</h3><p>${n} transaksi memakai kategori ini. Pindahkan ke:</p><select id=mv>${o.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select><div class=bar><button onclick=closeM()>Batal</button><button class=d onclick="rmCat('${id}',$('#mv').value)">Pindahkan dan hapus</button></div>`)}
async function rmCat(id,to){if(to)S.txs.forEach(t=>{if(t.cat==id)t.cat=to});S.cats=S.cats.filter(c=>c.id!=id);await save('txs');await save('cats');closeM();toast('Kategori dihapus');render()}
function pRep(){const r=range(R),a=agg(r),p=agg(prev(r)),dl=(x,y,i)=>{const d=x-y;return`<small class="${(d>=0)!=i?'in':'out'}">${d>=0?'+':''}${fmt(d)} vs periode sebelumnya</small>`},
ac=S.accounts.map(x=>{let i=0,o=0,u=0,m=0,f=0;a.L.forEach(t=>{if(t.acc==x.id){if(t.type=='in')i+=t.amt;else if(t.type=='out')o+=t.amt;else{u+=t.amt;f+=t.fee}}if(t.type=='tf'&&t.to==x.id)m+=t.amt});return i+o+u+m+f?`<div class=row style=cursor:default><i style=background:var(--ac)></i><div><b>${esc(x.n)}</b><small>Masuk ${fmt(i)} • Keluar ${fmt(o)} • Transfer keluar ${fmt(u)} • Transfer masuk ${fmt(m)} • Biaya ${fmt(f)}</small></div><span></span></div>`:''}).join('')||empty;
return`${pbar(R,'sR',['Harian','Mingguan','Bulanan','Tahunan','Rentang'],1)}<small style="margin-bottom:8px">Periode ${r[0]} s/d ${r[1]}</small><div class=g>${card('Pemasukan',fmt(a.inc),'in',dl(a.inc,p.inc,0))}${card('Pengeluaran',fmt(a.exp),'out',dl(a.exp,p.exp,1))}${card('Arus kas',fmt(a.inc-a.exp),a.inc>=a.exp?'in':'out',dl(a.inc-a.exp,p.inc-p.exp,0))}${card('Total transfer internal',fmt(a.tf),'tf')}${card('Biaya administrasi',fmt(a.fee),'out')}</div><div class="g g2"><div class=c><small>Pemasukan per kategori</small>${crow(a.ci,a.inc)}</div><div class=c><small>Pengeluaran per kategori</small>${pie(a)}${crow(a.ce,a.exp)}</div><div class=c><small>Aktivitas rekening</small>${ac}</div></div><div class=c><small>Transaksi pada periode ini</small>${a.L.slice().sort(sortTx).map(row).join('')||empty}</div>`}
function pSet(){return`<div class=c style="max-width:520px"><label>Nama pengguna</label><input id=su value="${esc(S.set.user)}"><label>Nama aplikasi</label><input id=sa value="${esc(S.set.app)}"><label>Mata uang</label><input value="Rupiah (IDR) • Asia/Jakarta" disabled><p><button class=p onclick="saveSet()">Simpan</button></p><small>Data hanya tersimpan di browser ini (IndexedDB). Menghapus data situs atau cache browser dapat menghilangkan seluruh data. Aplikasi tidak mencadangkan data secara otomatis.${db?'':' <b class=out>IndexedDB tidak tersedia: data hilang saat halaman ditutup.</b>'}</small><p><button class=d onclick="ask('Hapus SELURUH data (rekening, transaksi, kategori)? Tindakan ini tidak dapat dibatalkan.',wipe2)">Hapus seluruh data</button></p></div>`}
async function saveSet(){S.set={user:$('#su').value.trim()||'Pengguna',app:$('#sa').value.trim()||'AldayFinance'};await save('set');toast('Pengaturan disimpan');render()}
function wipe2(){modal(`<p>Konfirmasi akhir: ketik <b>HAPUS</b> untuk menghapus permanen.</p><input id=wc><div class=bar><button onclick=closeM()>Batal</button><button class=d onclick="wipe3()">Hapus permanen</button></div>`)}
function wipe3(){if($('#wc').value!=='HAPUS')return toast('Ketik HAPUS dengan huruf kapital',1);const done=()=>{S={accounts:[],cats:DEF,txs:[],set:{user:'Pengguna',app:'AldayFinance'},ready:0};save('cats');closeM();location.hash='';render();toast('Seluruh data dihapus')};if(!db)return done();const q=db.transaction('d','readwrite');q.objectStore('d').clear();q.oncomplete=done}
function setup(){return`<div class=c style="max-width:460px;margin:6vh auto"><h2>Selamat datang di AldayFinance</h2><small>Masukkan saldo awal tiap rekening sesuai kondisi sebenarnya. Kosongkan jika dimulai dari Rp0.</small><form onsubmit="return doSetup(event)">${['BRI','BNI','Permata'].map(b=>`<label>Saldo awal ${b} (Rp)</label><input name=${b} type=number step=1 inputmode=numeric placeholder=0>`).join('')}<p><button class=p>Mulai</button></p></form><small>Data hanya tersimpan di browser ini (IndexedDB) dan tidak dikirim ke server mana pun.</small></div>`}
async function doSetup(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),b=Object.keys(f),v=b.map(k=>+(f[k]||0));if(v.some(x=>!Number.isInteger(x)))return toast('Saldo awal harus bilangan bulat',1);S.accounts=b.map((k,i)=>({id:uid(),n:k,bank:k,open:v[i],created:today(),off:false}));S.ready=1;await save('accounts');await save('ready');render()}
function txForm(id,type){const A=act();if(!A.length&&!id)return toast('Tambahkan rekening aktif terlebih dahulu',1);const t=S.txs.find(x=>x.id==id)||{type:type||'out',date:today(),amt:'',fee:'',desc:'',note:'',acc:'',to:''},ao=s=>S.accounts.filter(a=>!a.off||a.id==s).map(a=>`<option value="${a.id}"${a.id==s?' selected':''}>${esc(a.n)}</option>`).join('');
modal(`<h3>${id?'Edit':'Tambah'} transaksi</h3><form id=f data-t="${t.type}" onsubmit="return saveTx(event,'${id||''}')"><label>Jenis</label><select name=type onchange="fT(this.value)">${[['in','Pemasukan'],['out','Pengeluaran'],['tf','Transfer']].map(([k,l])=>`<option value=${k}${t.type==k?' selected':''}>${l}</option>`).join('')}</select><label>Tanggal</label><input type=date name=date value="${t.date}" required><label>Nominal (Rp)</label><input type=number name=amt min=1 step=1 inputmode=numeric value="${t.amt}" required><div class=xc><label>Kategori</label><select name=cat id=cs>${catOpts(t.type,t.cat)}</select></div><label id=la>${lbl(t.type)}</label><select name=acc>${ao(t.acc||A[0]?.id)}</select><div class=xf><label>Rekening tujuan</label><select name=to>${ao(t.to||A[1]?.id)}</select><label>Biaya administrasi (Rp)</label><input type=number name=fee min=0 step=1 value="${t.fee||''}" placeholder=0></div><label>Deskripsi</label><input name=desc value="${esc(t.desc)}"><label>Catatan (opsional)</label><input name=note value="${esc(t.note)}"><div class=bar><button type=button onclick=closeM()>Batal</button><button class=p>Simpan</button>${id?`<button type=button class=d onclick="delTx('${id}')">Hapus</button>`:''}</div></form>`)}
const catOpts=(t,s)=>S.cats.filter(c=>c.t==t).map(c=>`<option value="${c.id}"${c.id==s?' selected':''}>${esc(c.n)}</option>`).join(''),lbl=t=>t=='in'?'Rekening tujuan':t=='out'?'Rekening sumber':'Rekening asal',fT=t=>{$('#f').dataset.t=t;if(t!='tf')$('#cs').innerHTML=catOpts(t);$('#la').textContent=lbl(t)};
async function saveTx(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),amt=+f.amt,tf=f.type=='tf',fee=tf?+(f.fee||0):0,ok=x=>S.accounts.some(a=>a.id==x);
const er=!Number.isInteger(amt)||amt<1?'Nominal harus bilangan bulat lebih dari 0':!/^\d{4}-\d\d-\d\d$/.test(f.date)||isNaN(new Date(f.date))?'Tanggal tidak valid':!ok(f.acc)?'Rekening tidak valid':tf&&(!ok(f.to)||f.to==f.acc)?'Rekening asal dan tujuan harus valid dan berbeda':!Number.isInteger(fee)||fee<0?'Biaya administrasi tidak valid':!tf&&!S.cats.some(c=>c.id==f.cat&&c.t==f.type)?'Pilih kategori':!tf&&!f.desc.trim()?'Deskripsi wajib diisi':'';if(er)return toast(er,1);
const i=S.txs.findIndex(x=>x.id==id),o={id:id||uid(),type:f.type,date:f.date,amt,cat:tf?'':f.cat,acc:f.acc,to:tf?f.to:'',fee,desc:f.desc.trim()||'Transfer',note:f.note.trim(),ts:i<0?Date.now():S.txs[i].ts};i<0?S.txs.push(o):S.txs[i]=o;await save('txs');closeM();toast('Transaksi disimpan');render()}
const delTx=id=>ask('Hapus transaksi ini? Saldo dan laporan diperbarui otomatis.',async()=>{S.txs=S.txs.filter(t=>t.id!=id);await save('txs');toast('Transaksi dihapus');render()});
const N=[['dash','🏠','Beranda',pDash],['tx','🧾','Transaksi',pTx],['acc','🏦','Rekening',pAcc],['tf','🔁','Transfer',pTf],['cat','🏷️','Kategori',pCat],['rep','📊','Laporan',pRep],['set','⚙️','Setelan',pSet]];
function render(){document.title=S.set.app;if(!S.ready){$('#app').innerHTML=setup();return}const v=location.hash.slice(1)||'dash',p=(N.find(n=>n[0]==v)||N[0])[3];$('#app').innerHTML=`<nav><h1>${esc(S.set.app)}</h1>${N.map(n=>`<a href="#${n[0]}" class="${v==n[0]?'on':''}"><b>${n[1]}</b>${n[2]}</a>`).join('')}</nav><main><small>Halo, ${esc(S.set.user)}</small>${p()}</main><button class="p fab" onclick="txForm()">＋</button>`}
onhashchange=()=>{closeM();render();scrollTo(0,0)};
(async()=>{try{db=await new Promise((o,r)=>{const q=indexedDB.open('aldayfinance',1);q.onupgradeneeded=()=>q.result.createObjectStore('d');q.onsuccess=()=>o(q.result);q.onerror=()=>r()})}catch(e){}
for(const k of['accounts','cats','txs','set','ready']){const v=db?await get(k):undefined;if(v!==undefined)S[k]=v}
if(!S.cats.length){S.cats=DEF;await save('cats')}render();if(!db)toast('IndexedDB tidak tersedia, data tidak akan tersimpan',1)})();
</script></body></html>
